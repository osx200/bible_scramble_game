server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self) — the scramble game's voice input needs getUserMedia.
    # An empty list here blocks the mic even for this origin.
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    # Leaderboard API (the `api` compose service).
    # Docker's embedded DNS + a variable upstream make nginx resolve `api` per
    # request instead of at startup, so the game still boots — and only the
    # leaderboard is unavailable — when the API container is down.
    # No add_header here, so the server-level security headers still apply;
    # the API sets its own Cache-Control: no-store.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream api:3001;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends to the host nginx's header on EC2, so the first hop is the
        # real player — the API rate-limits on that
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        client_max_body_size 4k;
    }

    # Serve static assets with long-lived cache
    # Vite fingerprints these filenames, so they can be cached forever.
    # One explicit Cache-Control rather than `expires 1y` + add_header, which
    # emits the header twice.
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Repeated because the add_header above stops this level from
        # inheriting the server-level security headers
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback — send all routes to index.html.
    # index.html must never be cached: it names the hashed asset files, so a
    # stale copy keeps serving the previous deploy's bundle.
    # `expires -1` emits Cache-Control: no-cache. It is deliberately not an
    # add_header — any add_header here would cancel the inherited security
    # headers above, which nginx only passes down when a level defines none.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
