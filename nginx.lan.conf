# nginx config for playing on the home network over HTTPS.
# Mounted by docker-compose.lan.yml — the image itself still ships the plain
# HTTP nginx.conf used on EC2, where the host nginx terminates TLS.
#
# HTTPS matters here for one reason: browsers only expose the microphone on a
# secure origin, so voice input is dead over http://192.168.x.x.

# ── Port 80: send everyone to HTTPS ─────────────────────────
server {
    listen 80;
    server_name _;

    # Container healthcheck — must not be redirected, it speaks plain HTTP
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The local CA, served over plain HTTP on purpose: a phone cannot trust
    # this server's HTTPS until it has installed this file, so it must be
    # reachable without it. Public certificate only — the CA private key
    # never leaves this machine.
    location = /rootCA.pem {
        alias /etc/nginx/certs/rootCA.pem;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="rootCA.crt"';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443: the app ───────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/lan-cert.pem;
    ssl_certificate_key /etc/nginx/certs/lan-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    # Deliberately no HSTS: it would pin this LAN IP to HTTPS in every phone
    # that visits, which is a nuisance to undo once the cert expires.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self) — voice input needs getUserMedia
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Fingerprinted filenames, safe to cache forever
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback. `expires -1` (not add_header) so the security headers above
    # are still inherited — see nginx.conf for the full explanation.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
