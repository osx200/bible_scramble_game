# Play on the home network over HTTPS (so phones get microphone access).
#
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build
#
# Then open https://<this machine's LAN IP> on any device on the same Wi-Fi.
# The certificate is issued by the local mkcert CA, so each device must trust
# certs/rootCA.pem once — otherwise the browser shows a security warning.
#
# The plain docker-compose.yml is unchanged and is still what EC2 uses, where
# the host nginx terminates TLS and the container stays on localhost.
services:
  bible-scramble:
    # Compose concatenates ports with the base file, so 127.0.0.1:8080 stays
    ports:
      - "0.0.0.0:80:80"     # redirects to HTTPS
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx.lan.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/lan-cert.pem:/etc/nginx/certs/lan-cert.pem:ro
      - ./certs/lan-key.pem:/etc/nginx/certs/lan-key.pem:ro
      # Public CA cert, downloadable at http://<lan-ip>/rootCA.pem so phones
      # can install it before they can trust HTTPS
      - ./certs/rootCA.pem:/etc/nginx/certs/rootCA.pem:ro
    # The image's healthcheck hits / on port 80, which now redirects to HTTPS
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
